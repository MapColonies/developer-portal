services:
    docusaurus:
        image: node:20-bookworm-slim
        working_dir: /app
        command: sh -c "apt-get update && apt-get install -y --no-install-recommends autoconf automake build-essential libtool nasm pkg-config && npm install && npm start -- --host 0.0.0.0"
        environment:
            ASK_AI_ENDPOINT: http://localhost:8787/api/ask-ai
        ports:
            - '3000:3000'
        volumes:
            - .:/app
            - docusaurus-node-modules:/app/node_modules
        depends_on:
            ask-ai-api:
                condition: service_healthy

    ollama:
        image: ollama/ollama:0.3.12
        ports:
            - '11434:11434'
        volumes:
            - ollama-data:/root/.ollama
        healthcheck:
            test: ['CMD', 'ollama', 'list']
            interval: 10s
            timeout: 5s
            retries: 12

    ollama-pull:
        image: ollama/ollama:0.3.12
        depends_on:
            ollama:
                condition: service_healthy
        environment:
            OLLAMA_HOST: http://ollama:11434
        entrypoint:
            [
                '/bin/sh',
                '-c',
                'ollama pull qwen2.5:0.5b && ollama pull nomic-embed-text',
            ]
        volumes:
            - ollama-data:/root/.ollama

    litellm:
        image: ghcr.io/berriai/litellm:main-latest
        depends_on:
            ollama:
                condition: service_healthy
        environment:
            LITELLM_MASTER_KEY: local-ask-ai-token
        command:
            [
                '--config',
                '/app/litellm.config.yaml',
                '--host',
                '0.0.0.0',
                '--port',
                '4000',
            ]
        volumes:
            - ./litellm.config.yaml:/app/litellm.config.yaml:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:4000/health/readiness'', timeout=2)"',
                ]
            interval: 10s
            timeout: 5s
            retries: 12

    ask-ai-litellm-proxy:
        image: nginx:1.27-alpine
        depends_on:
            litellm:
                condition: service_healthy
        ports:
            - '8088:80'
        volumes:
            - ./nginx.ask-ai.conf:/etc/nginx/conf.d/default.conf:ro
        healthcheck:
            test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/v1/models']
            interval: 10s
            timeout: 5s
            retries: 12

    ask-ai-api:
        image: node:20-alpine
        depends_on:
            ask-ai-index:
                condition: service_completed_successfully
        working_dir: /app/ask-ai
        command: npm start
        environment:
            ASK_AI_PORT: 8787
            ASK_AI_CORS_ORIGIN: '*'
            DOCS_ROOT: /app/docs
            ASK_AI_INDEX_PATH: /app/ask-ai/data/docs-index-current.json
            ASK_AI_INDEX_VERSIONS_DIR: /app/ask-ai/data/indexes
            LITELLM_BASE_URL: http://ask-ai-litellm-proxy/v1
            LITELLM_CHAT_MODEL: ollama/qwen2.5:0.5b
            LITELLM_EMBEDDING_MODEL: ollama/nomic-embed-text
        ports:
            - '8787:8787'
        volumes:
            - ./ask-ai:/app/ask-ai
            - ./docs:/app/docs:ro
        healthcheck:
            test:
                ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8787/healthz']
            interval: 10s
            timeout: 5s
            retries: 12

    ask-ai-index:
        image: node:20-alpine
        depends_on:
            ollama-pull:
                condition: service_completed_successfully
            ask-ai-litellm-proxy:
                condition: service_healthy
        working_dir: /app/ask-ai
        command: npm run index
        environment:
            DOCS_ROOT: /app/docs
            ASK_AI_INDEX_PATH: /app/ask-ai/data/docs-index-current.json
            ASK_AI_INDEX_VERSIONS_DIR: /app/ask-ai/data/indexes
            ASK_AI_INDEX_KEEP_VERSIONS: 3
            ASK_AI_INDEX_CHECKPOINT_INTERVAL: 10
            LITELLM_BASE_URL: http://ask-ai-litellm-proxy/v1
            LITELLM_EMBEDDING_MODEL: ollama/nomic-embed-text
            ASK_AI_EMBEDDING_CONCURRENCY: 2
        volumes:
            - ./ask-ai:/app/ask-ai
            - ./docs:/app/docs:ro

volumes:
    ollama-data:
    docusaurus-node-modules:
